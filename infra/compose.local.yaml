name: deledger_local

services:
  postgres-local:
    build:
      context: ..
      dockerfile: db/Dockerfile
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf", "-c", "shared_preload_libraries=pg_cron", "-c", "cron.database_name=deledger_local", "-c", "cron.timezone=Asia/Bangkok"]
    environment:
      POSTGRES_DB: deledger_local
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-deledger-local-postgres}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
      DELEDGER_WEB_PASSWORD: ${LOCAL_WEB_PASSWORD:-deledger-local-web}
      DELEDGER_MAINTENANCE_PASSWORD: ${LOCAL_MAINTENANCE_PASSWORD:-deledger-local-maintenance}
      DELEDGER_OPERATOR_PASSWORD: ${LOCAL_OPERATOR_PASSWORD:-deledger-local-operator}
    ports:
      - "127.0.0.1:${LOCAL_POSTGRES_PORT:-55433}:5432"
    networks:
      - local-data
    volumes:
      - deledger_local_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deledger_local"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

networks:
  local-data:
    name: ${DELEDGER_LOCAL_DATA_NETWORK:-deledger_local_data}

volumes:
  deledger_local_pgdata:
    name: ${DELEDGER_LOCAL_PGDATA_VOLUME:-deledger_local_pgdata}
