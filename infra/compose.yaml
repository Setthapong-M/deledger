name: deledger

services:
  postgres:
    build:
      context: ..
      dockerfile: db/Dockerfile
    environment:
      POSTGRES_DB: deledger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
      DELEDGER_WEB_PASSWORD_FILE: /run/secrets/web_password
      DELEDGER_IDENTITY_PASSWORD_FILE: /run/secrets/identity_password
    secrets:
      - postgres_password
      - web_password
      - identity_password
    networks:
      - data
    volumes:
      - deledger_pgdata:/var/lib/postgresql
    tmpfs:
      - /run/deledger-secrets:rw,noexec,nosuid,size=1m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deledger"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    environment:
      NODE_ENV: production
      PORT: "80"
      DELEDGER_ENV: ${DELEDGER_ENV:-qas}
      API_ORIGIN: http://api:3001
    depends_on:
      api: {condition: service_healthy}
    networks:
      edge:
        aliases: [deledger.internal]
      app: {}
    expose: ["80"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:80/api/health/live').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    user: "1001:1001"
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3001"
      DELEDGER_ENV: ${DELEDGER_ENV:-qas}
      APP_ORIGIN: http://deledger.internal
      BUSINESS_TIME_ZONE: Asia/Bangkok
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      IDENTITY_DATABASE_URL: ${IDENTITY_DATABASE_URL:?IDENTITY_DATABASE_URL is required}
      CLOUDFLARE_TEAM_DOMAIN: ${CLOUDFLARE_TEAM_DOMAIN:?CLOUDFLARE_TEAM_DOMAIN is required}
      CLOUDFLARE_ACCESS_AUD: ${CLOUDFLARE_ACCESS_AUD:?CLOUDFLARE_ACCESS_AUD is required}
      BACKUP_MODE: ${BACKUP_MODE:?BACKUP_MODE is required}
    depends_on:
      postgres: {condition: service_healthy}
    networks: [app, data, api-egress]
    expose: ["3001"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health/live').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: [ALL]
    user: "1001:1001"
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  cloudflared:
    image: cloudflare/cloudflared:2026.7.2
    command: ["tunnel", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}"]
    networks: [edge]
    depends_on:
      web: {condition: service_healthy}
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  migrate:
    build:
      context: ..
      dockerfile: infra/migrate/Dockerfile
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    depends_on:
      postgres: {condition: service_healthy}
    networks: [data]
    secrets: [postgres_password]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    restart: "no"
    profiles: [operations]

  backup:
    build:
      context: ..
      dockerfile: infra/backup/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres@postgres:5432/deledger
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      BACKUP_TARGET: /mnt/deledger-backups
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
    depends_on:
      postgres: {condition: service_healthy}
    networks: [data]
    secrets:
      - postgres_password
    volumes:
      - type: bind
        source: /mnt/deledger-backups
        target: /mnt/deledger-backups
    user: "1001:1001"
    profiles: [operations]

networks:
  edge:
    name: ${DELEDGER_EDGE_NETWORK:-deledger_edge}
  app:
    name: ${DELEDGER_APP_NETWORK:-deledger_app}
    internal: true
  api-egress:
    name: ${DELEDGER_API_EGRESS_NETWORK:-deledger_api_egress}
  data:
    name: ${DELEDGER_DATA_NETWORK:-deledger_data}
    internal: true

volumes:
  deledger_pgdata:
    name: ${DELEDGER_PGDATA_VOLUME:-deledger_pgdata}

secrets:
  postgres_password:
    file: ${DELEDGER_SECRET_DIR:-/etc/deledger/secrets}/postgres_password
  web_password:
    file: ${DELEDGER_SECRET_DIR:-/etc/deledger/secrets}/web_password
  identity_password:
    file: ${DELEDGER_SECRET_DIR:-/etc/deledger/secrets}/identity_password
