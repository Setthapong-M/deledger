worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    access_log off;
    server_tokens off;
    client_max_body_size 1m;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    resolver 127.0.0.11 valid=30s ipv6=off;
    server {
        listen 127.0.0.1:8081;
        location = /health { return 200 "ok\n"; }
        location / { return 404; }
    }
    server {
        listen 8443 ssl default_server;
        ssl_reject_handshake on;
    }
    server {
        listen 8443 ssl;
        server_name deledgr.online;
        ssl_certificate /etc/nginx/tls/origin.pem;
        ssl_certificate_key /etc/nginx/tls/origin.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        include /etc/nginx/cloudflare-allow.conf;
        location / {
            set $web_upstream http://web:80;
            proxy_pass $web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host deledgr.online;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host deledgr.online;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 60s;
        }
    }
}
