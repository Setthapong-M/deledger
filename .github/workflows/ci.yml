name: Deledger CI

on:
  push:
    branches: [main, online-mvp]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.1.3 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Static checks
        run: pnpm lint && pnpm typecheck && pnpm build
      - name: Unit tests
        run: pnpm test:unit
      - name: PostgreSQL integration tests
        run: pnpm test:integration
      - name: Operations tests
        run: pnpm test:ops
      - name: Browser dependencies
        run: pnpm --dir web exec playwright install --with-deps chromium firefox webkit
      - name: End-to-end tests
        run: pnpm test:e2e
      - name: Coverage
        run: pnpm test:coverage
